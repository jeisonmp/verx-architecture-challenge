# ADR-0005 §2 — qualidade (testes + cobertura).
#
# Roda em todo PR que mira `master` (gitflow: dev → master) E em todo PR que mira
# `dev` (inclui os PRs do Dependabot) — fecha a lacuna de validação de testes nos
# bumps de dependência, que antes só passavam pelo `compile` do `analysis.yml`:
#   - testes unitários + integração dos dois serviços Maven (A/B);
#   - service containers efêmeros PostgreSQL + Kafka (infra de integração);
#   - JaCoCo (goal `check`) com gate de cobertura de linhas ≥ 80% (a meta de 90%
#     no núcleo outbox/inbox é deferida — o núcleo não existe, PRD §9).
#
# Job único e sequencial A → B (sem matrix): mantido por simplicidade (um runner e
# um log por execução). B NÃO consome mais o stub CDC de A via Stub Runner — esse
# fluxo de messaging foi removido no Spring Cloud Contract 4.x (ADR-0015). Cada
# serviço roda apenas `mvn verify` no próprio diretório, sem depender do ~/.m2 de A.
#
# Sem credencial estática (ADR-0005/0007): apenas o GITHUB_TOKEN (OIDC) com escopo
# mínimo `contents: read`. As credenciais `cashflow` do PostgreSQL são credenciais
# EFÊMERAS de teste local (container descartável de CI), não secrets de produção —
# OIDC não se aplica a infra de teste local.

name: quality

on:
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  test:
    name: Testes + cobertura (PR → master | dev)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cashflow
          POSTGRES_USER: cashflow
          POSTGRES_PASSWORD: cashflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashflow -d cashflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Kafka em modo KRaft (sem ZooKeeper), nó único combinado controller+broker.
      # Imagem alinhada ao docker-compose local (confluentinc/cp-kafka:7.8.0) — o
      # tag bitnami/kafka:3.8 foi removido do Docker Hub (US-004 escolheu Confluent).
      # A replicação de tópicos internos é forçada a 1 (nó único), sem a qual o
      # broker não cria os tópicos de offsets/transações.
      kafka:
        image: confluentinc/cp-kafka:7.8.0
        ports:
          - 9092:9092
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # A: `verify` roda os testes (inclui o teste de contrato gerado) e o gate
      # JaCoCo (≥ 80%). Nada é instalado em ~/.m2 — B não consome o stub de A.
      - name: Testes A (lancamentos)
        run: mvn -B -U verify
        working-directory: repos/lancamentos
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cashflow
          SPRING_DATASOURCE_USERNAME: cashflow
          SPRING_DATASOURCE_PASSWORD: cashflow
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      # B: `verify` roda testes + gate de cobertura. O teste CDC de B desserializa
      # um fixture JSON local (tolerant reader) e não depende de artefato de A.
      - name: Testes B (consolidado)
        run: mvn -B -U verify
        working-directory: repos/consolidado
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cashflow
          SPRING_DATASOURCE_USERNAME: cashflow
          SPRING_DATASOURCE_PASSWORD: cashflow
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
