# ADR-0005 §2 — PR dev → master: qualidade (testes + cobertura).
#
# Roda em todo PR que mira `master` (gitflow: dev → master):
#   - testes unitários + integração dos dois serviços Maven (A/B);
#   - service containers efêmeros PostgreSQL + Kafka (infra de integração);
#   - JaCoCo (goal `check`) com gate de cobertura de linhas ≥ 80% (a meta de 90%
#     no núcleo outbox/inbox é deferida — o núcleo não existe, PRD §9).
#
# Job único e sequencial A → B (sem matrix): B consome o stub CDC de A via Stub
# Runner em modo LOCAL (ADR-0015), então o `mvn install` de A precisa instalar o
# stub no repositório Maven local (~/.m2) antes do `mvn verify` de B. Jobs de uma
# matrix rodam em runners separados e não compartilham ~/.m2.
#
# Sem credencial estática (ADR-0005/0007): apenas o GITHUB_TOKEN (OIDC) com escopo
# mínimo `contents: read`. As credenciais `cashflow` do PostgreSQL são credenciais
# EFÊMERAS de teste local (container descartável de CI), não secrets de produção —
# OIDC não se aplica a infra de teste local.

name: quality

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Testes + cobertura (dev → master)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cashflow
          POSTGRES_USER: cashflow
          POSTGRES_PASSWORD: cashflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashflow -d cashflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Kafka em modo KRaft (sem ZooKeeper), nó único combinado controller+broker.
      # A replicação de tópicos internos é forçada a 1 (nó único), sem a qual o
      # broker não cria os tópicos de offsets/transações.
      kafka:
        image: bitnami/kafka:3.8
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_NODE_ID: 0
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # A: `install` (não só `verify`) para instalar o stub CDC que B consome
      # (Stub Runner LOCAL — ADR-0015). O gate de cobertura JaCoCo roda no `verify`
      # dentro do próprio `install`, então A também é bloqueado se < 80%.
      - name: Testes A (lancamentos) — instala stub CDC para B
        run: mvn -B install
        working-directory: repos/lancamentos
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cashflow
          SPRING_DATASOURCE_USERNAME: cashflow
          SPRING_DATASOURCE_PASSWORD: cashflow
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      # B: `verify` roda testes + gate de cobertura; o stub de A já está em ~/.m2.
      - name: Testes B (consolidado) — consome stub CDC de A
        run: mvn -B verify
        working-directory: repos/consolidado
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cashflow
          SPRING_DATASOURCE_USERNAME: cashflow
          SPRING_DATASOURCE_PASSWORD: cashflow
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
