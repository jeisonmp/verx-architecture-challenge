name: release

# ADR-0005 — Pipeline de CI no GitHub Actions (dev → qas → master).
#
# Este workflow é a base de release da pipeline: deriva versão, CHANGELOG, tag e
# GitHub Release dos Conventional Commits (semantic-release) no push a `master`
# (release estável) e `dev` (pré-release beta). `feat/*`/`fix/*` não disparam nada.
#
# As demais etapas da ADR-0005 ficam em workflows dedicados (Sprint 1+) e NÃO
# estão implementadas aqui — apenas os estágios estão mapeados:
#
#   §1 PR → dev     : análise de código — SAST (SonarQube) + SCA (OWASP
#                     Dependency-Check) + gitleaks; gate: 0 risco crítico.
#   §2 dev → qas    : qualidade — testes unitários/integração (containers
#                     PostgreSQL + Kafka) + cobertura ≥ 80% (meta 90% outbox/inbox).
#   §3 qas → master : release — terraform validate + tfsec/checkov (automático)
#                     antes deste job de release (semantic-release).
#
# Este repositório não publica imagens OCI nem binários (ambiente 100% local):
# o job é único e não há build/push de imagem.

on:
  push:
    branches:
      - master
      - dev

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
